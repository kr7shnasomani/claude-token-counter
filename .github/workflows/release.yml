name: Build and Release Extension

on:
  push:
    tags:
      - "v*.*.*" # Trigger on version tags like v1.0.0

# Default to read-only; the release job opts into what it needs.
permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      # --ignore-scripts so no dependency can execute code in CI either,
      # independent of any local npm configuration.
      - run: npm ci --ignore-scripts

      # A tag is public the moment it is pushed, so everything that can fail
      # should fail here rather than after artifacts are attached.
      - run: npm test
      - run: npx eslint .

      - name: Tag matches the version being shipped
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version manifest.json)
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest ($MANIFEST)"
            exit 1
          fi

      - name: Permissions have not widened
        run: |
          set -euo pipefail
          test "$(jq -c .permissions manifest.json)" = '["storage"]'
          test "$(jq -c .optional_host_permissions manifest.json)" = '["https://claude.ai/*"]'

  build-and-release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job writes, and only to create the release
    env:
      # Exposed at job level so the upload step's `if` can test for it.
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Artifacts
        run: |
          set -euo pipefail
          VERSION_TAG=${GITHUB_REF_NAME}

          # 1. Chrome / Edge: strip the Firefox-only block to avoid store warnings
          mkdir -p dist/chrome
          cp -r src icons LICENSE README.md THIRD_PARTY_NOTICES.md PRIVACY.md dist/chrome/
          jq 'del(.browser_specific_settings)' manifest.json > dist/chrome/manifest.json
          (cd dist/chrome && zip -r "../../claude-token-counter-chrome-${VERSION_TAG}.zip" *)

          # 2. Firefox: keeps browser_specific_settings.gecko.id
          mkdir -p dist/firefox
          cp -r src icons manifest.json LICENSE README.md THIRD_PARTY_NOTICES.md PRIVACY.md dist/firefox/
          (cd dist/firefox && zip -r "../../claude-token-counter-firefox-${VERSION_TAG}.zip" *)


      - name: Check the artifacts are sane
        run: |
          set -euo pipefail
          VERSION_TAG=${GITHUB_REF_NAME}
          for f in claude-token-counter-chrome-${VERSION_TAG}.zip \
                   claude-token-counter-firefox-${VERSION_TAG}.zip; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done
          # Tests and node_modules must never reach a published zip.
          if unzip -l "claude-token-counter-chrome-${VERSION_TAG}.zip" | grep -qE "node_modules|/test/"; then
            echo "::error::build directory leaked into the Chrome artifact"
            exit 1
          fi
          # Publishing a zip whose manifest disagrees with the tag would be worse
          # than failing the release.
          unzip -p "claude-token-counter-chrome-${VERSION_TAG}.zip" manifest.json |
            jq -e --arg v "${VERSION_TAG#v}" '.version == $v' > /dev/null

      - name: Record checksums
        run: |
          set -euo pipefail
          sha256sum claude-token-counter-*.zip | tee SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            claude-token-counter-chrome-*.zip
            claude-token-counter-firefox-*.zip
            SHA256SUMS.txt
          generate_release_notes: true

      # Uploads the package as a draft in the Web Store dashboard. It deliberately
      # does NOT call :publish, so nothing is submitted for review until you press
      # the button yourself.
      #
      # Written with curl rather than a marketplace action on purpose: these
      # credentials can publish to every user of the extension, and no third-party
      # action needs that level of access.
      #
      # Skipped automatically when the secrets are absent, so forks still build.
      - name: Upload package to the Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        run: |
          set -euo pipefail
          ZIP="claude-token-counter-chrome-${GITHUB_REF_NAME}.zip"

          ACCESS_TOKEN=$(curl -sS --fail-with-body -X POST \
            https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Could not exchange the refresh token. Has it been revoked?"
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$ZIP" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_ITEM_ID}:upload")

          echo "$RESPONSE" | jq .
          STATE=$(echo "$RESPONSE" | jq -r '.uploadState // empty')

          if [ "$STATE" != "SUCCESS" ]; then
            echo "::error::Upload failed ($STATE). Most common cause: the version in manifest.json is not higher than the one already in the store."
            echo "$RESPONSE" | jq -r '.itemError[]?.error_detail // empty'
            exit 1
          fi

          echo "::notice::Uploaded $(echo "$RESPONSE" | jq -r .crxVersion) as a draft. Press Submit for review in the dashboard when ready."
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: bioobpobpbeohjoefndgkiaakboimpch
