# Runs on every push and pull request. This is the workflow worth making a
# required status check: it is what stops a broken or less-safe build reaching
# a release tag.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Read-only. Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The extension itself runs in a browser; these versions only cover the
        # test harness. LTS plus current is enough.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts so no dependency can execute code in CI either,
      # independent of any local npm configuration.
      - run: npm ci --ignore-scripts

      # 9 suites: cache timer, export, inventory, packaging, popup, settings,
      # the usage-bar markers, the usage payload parsers, and the security
      # guards.
      - run: npm test

      - run: npx eslint .

  package:
    name: Manifest and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions agree across manifest and package.json
        run: |
          set -euo pipefail
          MANIFEST=$(jq -r .version manifest.json)
          PACKAGE=$(jq -r .version package.json)
          echo "manifest=$MANIFEST package=$PACKAGE"
          test "$MANIFEST" = "$PACKAGE"

      - name: Every declared content script exists
        run: |
          set -euo pipefail
          jq -r '.content_scripts[].js[], .content_scripts[].css[], .web_accessible_resources[].resources[], .action.default_popup' manifest.json |
            while read -r f; do
              test -f "$f" || { echo "missing: $f"; exit 1; }
            done

      - name: Permissions have not widened
        run: |
          set -euo pipefail
          test "$(jq -c .permissions manifest.json)" = '["storage"]'
          test "$(jq -c .optional_host_permissions manifest.json)" = '["https://claude.ai/*"]'
          test "$(jq -r '.host_permissions // "none"' manifest.json)" = "none"

      - name: The release build actually produces all three artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/chrome dist/firefox
          cp -r src icons LICENSE README.md THIRD_PARTY_NOTICES.md PRIVACY.md dist/chrome/
          jq 'del(.browser_specific_settings)' manifest.json > dist/chrome/manifest.json
          (cd dist/chrome && zip -qr ../chrome.zip *)
          cp -r src icons manifest.json LICENSE README.md THIRD_PARTY_NOTICES.md PRIVACY.md dist/firefox/
          (cd dist/firefox && zip -qr ../firefox.zip *)
          test -s dist/chrome.zip && test -s dist/firefox.zip
          jq -e '.browser_specific_settings == null' dist/chrome/manifest.json > /dev/null
          echo "chrome $(du -h dist/chrome.zip | cut -f1) | firefox $(du -h dist/firefox.zip | cut -f1)"
