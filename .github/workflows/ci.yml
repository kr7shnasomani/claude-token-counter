# Runs on every push and pull request. This is the workflow worth making a
# required status check: it is what stops a broken or less-safe build reaching
# a release tag.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Read-only. Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The extension itself runs in a browser; this only covers the test harness.
        node-version: [22.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts so no dependency can execute code in CI either,
      # independent of any local npm configuration.
      - run: npm ci --ignore-scripts

      # Includes the packaging and security suites: versions agree, every declared
      # file exists, permissions have not widened.
      - run: npm test

      - run: npx eslint .

  package:
    name: Manifest and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The release build actually produces all three artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/chrome dist/firefox
          cp -r src icons LICENSE README.md THIRD_PARTY_NOTICES.md PRIVACY.md dist/chrome/
          jq 'del(.browser_specific_settings)' manifest.json > dist/chrome/manifest.json
          (cd dist/chrome && zip -qr ../chrome.zip *)
          cp -r src icons manifest.json LICENSE README.md THIRD_PARTY_NOTICES.md PRIVACY.md dist/firefox/
          (cd dist/firefox && zip -qr ../firefox.zip *)
          test -s dist/chrome.zip && test -s dist/firefox.zip
          jq -e '.browser_specific_settings == null' dist/chrome/manifest.json > /dev/null
          echo "chrome $(du -h dist/chrome.zip | cut -f1) | firefox $(du -h dist/firefox.zip | cut -f1)"
