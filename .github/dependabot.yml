# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The extension ships no npm dependencies, so the real supply-chain surface is
  # the actions that build and publish releases. A compromised action could inject
  # code into a published zip, which is why these are the ones worth watching.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  # package.json carries dev dependencies only (the linter). This entry watches
  # them, and any dependency added later, from the moment it lands.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
